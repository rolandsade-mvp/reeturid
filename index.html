  if (!r.ok) { const e = new Error((j && j.message) || "other"); e.code = (j && j.message) || "other"; throw e; }
  return j;
}
const errText = e => T.err[e && e.code] || T.err.other;
let toastT = null;
function toast(msg) {
  let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200);
}
// The page's own confirm step (no browser dialogs): the first click arms the button for a few seconds.
function armed(btn, text, fn) {
  if (!btn) return;
  const label = btn.textContent; let t = null;
  btn.onclick = () => {
    if (btn.dataset.armed) { clearTimeout(t); delete btn.dataset.armed; fn(); return; }
    btn.dataset.armed = "1"; btn.textContent = text; t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 3500);
  };
}
const byId = (S, id) => S.players.find(p => p.id === id);
const nameOf = (S, id) => byId(S, id)?.name || "?";
const aliveOf = S => S.players.filter(p => p.status === "alive");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = $("#app");
const params = new URLSearchParams(location.search);

// Poll the cheap version number; fetch the full state only when something changed.
function poller(code, load, every = 2000) {
  let v = -1, busy = false, stop = false;
  const tick = async () => {
    if (stop || busy) return; busy = true;
    try { const nv = await rpc("reeturid_version", { p_code: code }); if (nv !== v) { v = nv; await load(); } }
    catch {}
    busy = false;
  };
  const id = setInterval(tick, every); tick();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { v = -1; tick(); } });
  return { bump: () => { v = -1; tick(); }, stop: () => { stop = true; clearInterval(id); } };
}

// ---------------------------------------------------------------- phone
function phone(code) {
  const key = "rt-p-" + code;
  let token = lsGet(key), S = null, taskOpen = false, taskTimer = null, mode = "murder", lastPhase = null, holding = false, pending = false;
  const showJoin = (msg = "") => {
    app.innerHTML = `
      <main class="landing">
        <div><div class="logo">${T.title}</div><p class="muted">${T.code}: <b>${esc(code)}</b></p></div>
        <form class="card" id="jf">
          <div class="field"><label for="nm">${T.name}</label><input id="nm" maxlength="24" autocomplete="nickname" required></div>
          <div class="field"><label for="pin">${T.pin}</label><input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required></div>
          <p class="muted" style="margin:0;font-size:14px">${T.pinHelp}</p>
          <p class="err" id="jerr" ${msg ? "" : "hidden"}>${esc(msg)}</p>
          <button class="btn gold" type="submit" id="jb">${T.join}</button>
        </form>
      </main>`;
    $("#jf").onsubmit = async e => {
      e.preventDefault(); const b = $("#jb"); b.disabled = true; b.textContent = T.joining;
      try {
        const r = await rpc("reeturid_join", { p_code: code, p_name: $("#nm").value, p_pin: $("#pin").value });
        token = r.token; lsSet(key, token); start();
      } catch (err) { $("#jerr").hidden = false; $("#jerr").textContent = errText(err); b.disabled = false; b.textContent = T.join; }
    };
  };
  const load = async () => {
    try { S = await rpc("reeturid_me", { p_token: token }); if (holding) pending = true; else render(); }
    catch (e) { if (e.code === "bad_token") { lsDel(key); token = null; showJoin(T.err.bad_token); P && P.stop(); } }
  };
  let P = null;
  const start = () => { P = poller(code, load); };
  const act = async (fn, args) => {
    try { S = await rpc(fn, { p_token: token, ...args }); render(); }
    catch (e) { toast(errText(e)); P && P.bump(); }
  };

  function roleCard(me) {
    const isT = me.role === "traitor";
    const fellows = isT ? (me.fellows.length ? `<p>${T.fellows} <b>${me.fellows.map(f => esc(f.name) + (f.status !== "alive" ? " (" + (f.status === "murdered" ? T.murderedL : T.banishedL) + ")" : "")).join(", ")}</b></p>` : `<p>${T.noFellows}</p>`) : "";
    return `<div class="role ${isT ? "traitor" : "faithful"}">
      <div class="rname">${isT ? T.traitor : T.faithful}</div>
      <p>${isT ? T.youTraitor : T.youFaithful}</p>${fellows}${isT && me.newTraitor ? `<p class="muted">${T.recruitedNote}</p>` : ""}</div>`;
  }
  function render() {
    const me = S.me, ph = S.phase;
    if (lastPhase && lastPhase !== ph && navigator.vibrate) { try { navigator.vibrate(ph === "night" ? [120, 80, 120] : 80); } catch {} }
    if (lastPhase !== ph) { taskOpen = false; }
    lastPhase = ph;
    const alive = me.status === "alive";
    let body = "";
    if (ph === "lobby") {
      body = `<div class="task"><h2>${T.lobbyWait}</h2><p class="muted" style="margin:0">${T.lobbyJoined(S.players.length)}: ${S.players.map(p => esc(p.name)).join(", ")}</p></div>`;
    } else if (ph === "over") {
      const mine = me.role === "traitor" ? T.traitor : T.faithful;
      body = `<div class="task" style="text-align:center"><div class="big-emoji">${S.winner === "faithful" ? "⚜️" : "🗡️"}</div><h2>${T.over(S.winner)}</h2><p style="margin:0">${T.wereYou("<b>" + mine.toLowerCase() + "</b>")}</p>${S.coins ? `<p class="muted" style="margin:0">${T.potShare(S.coins)}</p>` : ""}</div>`;
    } else if (!alive) {
      body = `<div class="banner">${me.status === "murdered" ? T.murdered : T.banished}</div><div class="banner"><b>${T.lookTv}</b></div>`;
    } else if (ph === "vote" || ph === "revote") {
      const opts = ph === "revote" ? S.candidates.map(id => byId(S, id)).filter(p => p && p.id !== me.id) : aliveOf(S).filter(p => p.id !== me.id);
      body = `<div class="task"><h2>${ph === "revote" ? T.revote : T.vote}</h2>
        <div class="choices">${opts.map(p => `<button type="button" class="choice" data-v="${p.id}" aria-pressed="${me.vote === p.id}">${esc(p.name)}${me.vote === p.id ? "<small>✓</small>" : ""}</button>`).join("")}</div>
        <p class="muted" style="margin:0;font-size:14px">${T.voteHelp}</p></div>`;
    } else if (ph === "endvote") {
      body = `<div class="task"><h2>${T.endvote}</h2><p style="margin:0">${T.endQ}</p>
        <div class="choices"><button type="button" class="choice" data-c="end" aria-pressed="${me.vote === "end"}">${T.endEnd}</button>
        <button type="button" class="choice" data-c="banish" aria-pressed="${me.vote === "banish"}">${T.endBanish}</button></div>
        <p class="muted" style="margin:0;font-size:14px">${T.voteHelp}</p></div>`;
    } else if (ph === "night") {
      body = taskOpen ? nightTask(me) : `<div class="task"><h2>${T.night}</h2><p class="muted" style="margin:0">${T.taskHint}</p>
        ${me.nightPick ? `<p style="margin:0">${T.done}</p>` : ""}
        <button type="button" class="btn gold" id="openTask">${T.openTask}</button></div>`;
    } else {
      body = `<div class="banner"><b>${T.lookTv}</b></div>`;
    }
    const seal = ph === "lobby" ? "" : `
      <div class="seal" id="seal" role="button" tabindex="0" aria-label="${T.holdRole}">
        <div id="sealClosed"><div class="wax">R</div><div class="hint">${ph === "roles" ? T.holdRole : T.holdAgain}</div></div>
        <div id="sealOpen" hidden>${roleCard(me)}</div>
      </div>`;
    app.innerHTML = `
      <main class="phone">
        <div class="phead"><span class="who">${esc(me.name)}</span><span class="tag">${T.title.toUpperCase()}</span></div>
        ${me.shield && alive && ph !== "over" ? `<div class="banner gold">${T.shield}</div>` : ""}
        ${body}
        ${seal}
      </main>
      ${me.recruitOffer ? `<div class="overlay"><div class="task"><h2>${T.offerTitle}</h2><p style="margin:0">${T.offerText}</p>

  }

      const allAgree = me.picks.length === me.fellows.filter(f => f.status === "alive").length + 1 && new Set(me.picks.map(p => p.kind + p.target)).size === 1;
      return `<div class="task"><h2>${mode === "recruit" ? T.pickRecruit : T.pickVictim}</h2>
        ${me.canRecruit && !rs ? `<div class="seg"><button type="button" data-mode="murder" aria-pressed="${mode === "murder"}">${T.murder}</button><button type="button" data-mode="recruit" aria-pressed="${mode === "recruit"}">${T.recruit}</button></div>` : ""}
        ${rs === "offered" ? `<div class="banner red">${T.recruitWait(esc(rt))}</div>` : rs === "accepted" ? `<div class="banner red">${T.recruitYes(esc(rt))}</div>` : rs === "declined" ? `<div class="banner">${T.recruitNo(esc(rt))}</div>` : `
        <div class="choices">${targets.map(p => `<button type="button" class="choice" data-n="${p.id}" aria-pressed="${pick && pick.target === p.id && pick.kind === mode}">${esc(p.name)}</button>`).join("")}</div>
        ${partner}<p class="muted" style="margin:0;font-size:14px">${allAgree ? T.agreed : T.agreeHint}</p>`}
        <button type="button" class="btn" id="closeTask">${T.close}</button></div>`;
    }
    const pick = me.nightPick && me.nightPick.kind === "suspect" ? me.nightPick.target : null;
    return `<div class="task"><h2>${T.suspect}</h2>
      <div class="choices">${others.map(p => `<button type="button" class="choice" data-n="${p.id}" aria-pressed="${pick === p.id}">${esc(p.name)}</button>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:14px">${pick ? T.done : T.suspectHint}</p>

      seal.addEventListener("keyup", () => open(false));

    }
    document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => act("reeturid_vote", { p_target: b.dataset.v, p_choice: null }));
    document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => act("reeturid_vote", { p_target: null, p_choice: b.dataset.c }));
    const ot = $("#openTask"); if (ot) ot.onclick = () => { taskOpen = true; render(); idle(); };
    const ct = $("#closeTask"); if (ct) ct.onclick = () => { taskOpen = false; render(); };
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; render(); idle(); });

// ---------------------------------------------------------------- TV / host
function tv() {
  let H = lsGet("rt-host"), S = null, P = null, anim = { key: null, step: 0, timer: null, done: false };
  const create = async () => {
    app.innerHTML = `<main class="landing"><div class="logo">${T.title}</div><p class="muted">…</p></main>`;
    try { H = await rpc("reeturid_create", { p_settings: {} }); lsSet("rt-host", H); boot(); }
    catch (e) { app.innerHTML = `<main class="landing"><div class="logo">${T.title}</div><p class="err">${esc(errText(e))}</p></main>`; }
  };
  const load = async () => {
    try { S = await rpc("reeturid_host", { p_host: H.hostToken }); render(); }
    catch (e) { if (e.code === "bad_host") { lsDel("rt-host"); create(); } }
  };
  const act = async (a, arg = {}) => {
    try { S = await rpc("reeturid_act", { p_host: H.hostToken, p_action: a, p_arg: arg }); render(); }
    catch (e) { toast(errText(e)); P && P.bump(); }
  };
  const boot = () => { P && P.stop(); P = poller(H.code, load, 1500); };
  const joinUrl = () => location.origin + location.pathname + "?g=" + H.code;

  function sideList() {
    // Keep the result off the list until the TV has revealed it.
    const hiddenOut = (S.phase === "votes" && !anim.done) ? S.banishedId : (S.phase === "breakfast" && !anim.step) ? S.murderedId : null;
    const view = S.players.map(p => p.id === hiddenOut ? { ...p, status: "alive" } : p);
    const ic = p => p.status === "murdered" ? "☠" : p.status === "banished" ? "⚖" : "●";
    return `<aside class="side"><h3>${T.playersH.toUpperCase()} · ${view.filter(p => p.status === "alive").length}/${S.players.length}</h3>
      <ul class="plist">${view.map(p => `<li class="${p.status !== "alive" ? "out" : ""}"><span class="ic" aria-hidden="true">${ic(p)}</span><span>${esc(p.name)}</span>
        ${S.phase === "lobby" ? `<button type="button" data-kick="${p.id}" aria-label="Eemalda ${esc(p.name)}">×</button>` : p.role ? `<span class="r ${p.role}">${p.role === "traitor" ? T.traitor : T.faithful}</span>` : p.status !== "alive" ? `<span class="r">${p.status === "murdered" ? T.murderedL : T.banishedL}</span>` : ""}</li>`).join("")}</ul>
      ${S.host.lockedOut.length ? `<p class="muted" style="margin:0">${T.lockedOutL} ${S.host.lockedOut.map(p => `${esc(p.name)} <button type="button" class="btn quiet" data-unlock="${p.id}">${T.unlock}</button>`).join(" ")}</p>` : ""}
      <p class="muted" style="margin:0;font-size:13px">${T.hostInfo}</p></aside>`;
  }
  function stage() {
    const ph = S.phase, alive = aliveOf(S);
    if (ph === "lobby") {
      const auto = S.host.autoTraitors, set = +S.settings.traitors || 0;
      return `<div class="qrwrap"><div id="qr" aria-label="QR"></div>
        <div style="display:grid;gap:14px"><h1>${T.scan}</h1><div class="codebig">${esc(H.code)}</div><div class="url">${T.orGo} ${esc(joinUrl())}</div>
        <div class="setup">
          <label for="tc">${T.traitorsSet}: <select id="tc"><option value="0">${T.auto} (${auto})</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${set === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
          <label><input type="checkbox" id="tellCount" ${S.settings.tellCount !== false ? "checked" : ""}> ${T.tellCount}</label>
          <label><input type="checkbox" id="recr" ${S.settings.recruiting !== false ? "checked" : ""}> ${T.recruiting}</label>
        </div></div></div>`;
    }
    if (ph === "roles") return `<h1 class="fade-in">${T.rolesDealt}</h1><p class="sub">${T.rolesSub}</p>${S.traitorCount ? `<p class="sub"><b>${T.inGame(S.traitorCount)}</b></p>` : ""}<div class="rules">${T.rules.map(r => `<div>${r}</div>`).join("")}</div>`;
    if (ph === "vote" || ph === "revote" || ph === "endvote") {
      const pool = alive, n = pool.filter(p => p.voted).length;
      const title = ph === "endvote" ? T.endTitle : ph === "revote" ? T.tie : T.rt(S.round);
      const sub = ph === "endvote" ? T.endSub : ph === "revote" ? T.tieSub(S.candidates.map(id => esc(nameOf(S, id))).join(" / ")) : T.rtSub;
      return `<h1>${title}</h1><p class="sub">${sub}</p><div class="grid-voted">${pool.map(p => `<span class="pill ${p.voted ? "done" : ""}">${p.voted ? "✓ " : ""}${esc(p.name)}</span>`).join("")}</div><p class="sub"><b>${T.votedN(n, pool.length)}</b></p>`;
    }
    if (ph === "votes") {
      const key = "votes" + S.round + ":" + S.banishedId;
      if (anim.key !== key) { clearInterval(anim.timer); anim = { key, step: 0, done: false, order: shuffle(S.lastVote) }; anim.timer = setInterval(() => { anim.step++; if (anim.step >= anim.order.length) { clearInterval(anim.timer); anim.done = true; } render(); }, 1900); }
      const shown = anim.order.slice(0, anim.step), tally = {};

        <div class="tally">${Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([id, c]) => `<div class="row"><span>${esc(nameOf(S, id))}</span><span class="bar"><i style="width:${c / max * 100}%"></i></span><span>${c}</span></div>`).join("")}</div>

      if (anim.key !== key) { clearInterval(anim.timer); anim = { key, step: 0 }; anim.timer = setTimeout(() => { anim.step = 1; render(); }, 2800); }
      return `<h1>${T.wasA(esc(p.name))}</h1>
        ${anim.step ? `<div class="huge fade-in ${p.role}">${p.role === "traitor" ? T.traitor.toUpperCase() : T.faithful.toUpperCase()}</div>
          ${S.ultimatum ? `<p class="sub fade-in">${T.ultimatum}</p>` : ""}${S.winner ? `<p class="sub fade-in"><b>${T.winnerReady(S.winner)}</b></p>` : ""}` : `<div class="huge suspense">…</div>`}`;
    }
    if (ph === "night") {
      return `<div class="moon" aria-hidden="true"></div><h1>${T.nightTitle}</h1><p class="sub">${T.nightSub}</p>
        <div class="status-row"><span class="chip">${T.tasksDone(S.nightDone || 0, alive.length)}</span><span class="chip ${S.host.traitorsReady ? "ok" : ""}">${S.host.traitorsReady ? T.traitorsReady : T.traitorsThinking}</span></div>`;
    }
    if (ph === "breakfast") {
      const key = "bf" + S.night;
      if (anim.key !== key) { clearInterval(anim.timer); anim = { key, step: 0 }; anim.timer = setTimeout(() => { anim.step = 1; render(); }, 3200); }
      const sus = (S.suspects || []).slice(0, 5), max = Math.max(1, ...sus.map(s => s.count));
      return `<h1>${T.breakfastTitle}</h1>
        ${!anim.step ? `<p class="sub suspense">${T.breakfastSuspense}</p>` : S.murderedId ? `<p class="sub fade-in">${T.murderedIs}</p><div class="huge fade-in">${esc(nameOf(S, S.murderedId))}</div>` : `<div class="huge fade-in faithful" style="font-size:clamp(40px,5vw,84px)">${T.nobody}</div>`}
        ${anim.step && S.winner ? `<p class="sub fade-in"><b>${T.winnerReady(S.winner)}</b></p>` : ""}
        ${anim.step && sus.length ? `<div class="tally fade-in"><p class="sub" style="margin:0">${T.suspects}</p>${sus.map(s => `<div class="row"><span>${esc(nameOf(S, s.id))}</span><span class="bar"><i style="width:${s.count / max * 100}%"></i></span><span>${s.count}</span></div>`).join("")}</div>` : ""}`;

    if (ph === "day") return `<h1>${T.dayTitle}</h1><p class="sub">${S.endvote ? T.endResult(S.endvote.end, S.endvote.banish) : T.daySub}</p>`;
    if (ph === "over") {
      return `<h1 class="fade-in">${T.overTitle(S.winner)}</h1>${S.coins ? `<p class="sub">${T.potShare(S.coins)}</p>` : ""}
        <div class="endgrid">${S.players.map(p => `<div class="${p.role}"><span>${esc(p.name)}</span><small>${p.role === "traitor" ? T.traitor : T.faithful} · ${p.status === "alive" ? T.alive : p.status === "murdered" ? T.murderedL : T.banishedL}</small></div>`).join("")}</div>`;
    }
    return "";
  }
  function controls() {
    const ph = S.phase, w = S.winner, b = [];
    const btn = (id, label, cls = "") => `<button type="button" class="btn ${cls}" id="${id}">${label}</button>`;
    if (ph === "lobby") b.push(btn("deal", T.deal, "gold"));
    if (ph === "roles") b.push(btn("rt", T.startRT, "gold"));
    if (ph === "vote" || ph === "revote") b.push(btn("closeVote", T.closeVote, "gold"));
    if (ph === "votes") b.push(anim.done ? btn("revealRole", T.revealRole, "red") : btn("skip", T.skip));
    if (["banished", "breakfast", "day"].includes(ph)) {
      if (w) b.push(btn("finish", T.showWinners, "gold"));
      else {
        if (ph !== "breakfast") b.push(btn("night", T.startNight, ph === "banished" ? "gold" : ""));
        b.push(btn("rt", ph === "banished" ? T.newRT : T.startRT, ph !== "banished" ? "gold" : ""));
        b.push(btn("endvote", T.endVoteBtn));
      }
    }
    if (ph === "night") b.push(btn("breakfast", T.breakfast, "gold"));
    if (ph === "endvote") b.push(btn("closeEnd", T.closeEnd, "gold"));
    const shieldUi = !["lobby", "over"].includes(ph) ? `<span class="grow"></span>
      <label class="muted" for="shSel">${S.host.shieldGiven ? T.shieldGiven : T.shieldNone}</label>
      <select id="shSel"><option value="">${T.shieldPick}</option>${aliveOf(S).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      ${btn("shield", T.shieldBtn)}` : `<span class="grow"></span>`;
    const tail = ph === "lobby" ? btn("newGame", T.newGame, "quiet") : ph !== "over" ? btn("finishNow", T.finish, "quiet") : btn("newGame", T.newGame, "quiet");
    return `<div class="controls">${b.join("")}${shieldUi}${tail}</div>`;
  }
  function render() {
    if (!S) return;
    const focus = document.activeElement && document.activeElement.id;
    const keepSel = $("#shSel") ? $("#shSel").value : "";
    app.innerHTML = `<main class="tv">
      <header class="tvtop"><div class="logo">${T.title.toUpperCase()}</div>
        <div class="pot"><span class="lbl">${T.potLbl}</span><span class="coin" aria-hidden="true">💰</span><span>${S.coins}</span>
          <button type="button" class="btn" data-coin="-1" aria-label="${T.potLbl} −1" title="${T.potLbl} −1">−1</button><button type="button" class="btn" data-coin="1" aria-label="${T.potLbl} +1" title="${T.potLbl} +1">+1</button><button type="button" class="btn" data-coin="5" aria-label="${T.potLbl} +5" title="${T.potLbl} +5">+5</button></div>
        <span class="muted">${T.code}: <b>${esc(H.code)}</b></span></header>
      <div class="tvmain"><section class="stage" aria-live="polite">${stage()}</section>${sideList()}</div>
      ${controls()}</main>`;
    if (S.phase === "lobby" && window.QRCode) { new QRCode($("#qr"), { text: joinUrl(), width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M }); }
    if ($("#shSel")) $("#shSel").value = keepSel;
    if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
    bind();
  }
  function bind() {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("deal", () => act("deal"));
    on("rt", () => act("roundtable"));
    const cv = $("#closeVote");
    if (cv) { const pool = aliveOf(S); if (pool.every(p => p.voted)) cv.onclick = () => act("close_vote"); else armed(cv, T.notAll, () => act("close_vote")); }
    on("skip", () => { clearInterval(anim.timer); anim.step = anim.order.length; anim.done = true; anim.skipped = true; render(); });
    on("revealRole", () => act("reveal_role"));
    on("night", () => act("night"));
    on("breakfast", () => act("breakfast"));
    on("endvote", () => act("endvote"));
    on("closeEnd", () => act("close_endvote"));
    on("finish", () => act("finish"));
    armed($("#finishNow"), T.reallyFinish, () => act("finish"));
    armed($("#newGame"), T.reallyNew, () => { lsDel("rt-host"); P && P.stop(); create(); });
    on("shield", () => { const id = $("#shSel").value; if (!id) return toast(T.shieldPick); act("shield", { id }).then(() => toast(T.shieldGiven)); });
    document.querySelectorAll("[data-coin]").forEach(b => b.onclick = () => act("coins", { delta: +b.dataset.coin }));
    document.querySelectorAll("[data-kick]").forEach(b => b.onclick = () => act("kick", { id: b.dataset.kick }));
    document.querySelectorAll("[data-unlock]").forEach(b => b.onclick = () => act("unlock", { id: b.dataset.unlock }));
    const tc = $("#tc"); if (tc) tc.onchange = () => act("settings", { traitors: +tc.value });
    const tcount = $("#tellCount"); if (tcount) tcount.onchange = () => act("settings", { tellCount: tcount.checked });
    const rc = $("#recr"); if (rc) rc.onchange = () => act("settings", { recruiting: rc.checked });
  }
  if (H && H.hostToken) boot(); else create();
}

// ---------------------------------------------------------------- start
const g = params.get("g");
if (params.has("host")) tv();
else if (g) phone(g.trim().toUpperCase());
else landing();
</script>
</body>
</html>
